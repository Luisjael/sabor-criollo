<!-- model-viewer con fallback entre CDNs. Si ambos fallan, app.js muestra un aviso. -->
<script>
(function () {
  var sources = [
    "https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js",
    "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"
  ];
  function tryLoad(i) {
    if (i >= sources.length) {
      document.dispatchEvent(new Event("modelviewer-failed"));
      return;
    }
    var s = document.createElement("script");
    s.type = "module";
    s.src = sources[i];
    s.onerror = function () { tryLoad(i + 1); };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
